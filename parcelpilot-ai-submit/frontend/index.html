<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParcelPilot — Support Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0f1620;
    --panel: #161f2c;
    --panel-2: #1c2635;
    --line: #263244;
    --text: #e7ecf3;
    --text-dim: #8fa0b5;
    --amber: #e8a33d;
    --amber-dim: #4a3a1e;
    --green: #4fbf85;
    --red: #e0645a;
    --blue: #5aa2e0;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; height:100vh; overflow:hidden;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  #app{ display:grid; grid-template-columns: 300px 1fr; height:100vh; }

  /* Sidebar */
  #sidebar{ background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:20px; gap:20px; overflow-y:auto; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{ width:30px;height:30px;border-radius:7px; background:linear-gradient(135deg,var(--amber),#c97a1f); display:flex;align-items:center;justify-content:center;font-weight:700;color:#1a1204; font-size:14px;}
  .brand .name{ font-weight:700; font-size:15.5px; letter-spacing:-0.01em;}
  .brand .tag{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em;}

  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.07em; }
  select, button.role-btn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:9px 10px; border-radius:8px; font-size:13.5px; font-family:inherit; cursor:pointer;
  }
  .role-toggle{ display:flex; gap:6px; }
  .role-toggle button{ flex:1; padding:9px 8px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--text-dim); font-size:12.5px; font-weight:600; cursor:pointer; transition:.15s; }
  .role-toggle button.active{ background:var(--amber-dim); border-color:var(--amber); color:var(--amber); }

  .divider{ height:1px; background:var(--line); }
  .context-card{ background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius); padding:12px; font-size:12.5px; color:var(--text-dim); line-height:1.6;}
  .context-card b{ color:var(--text); }

  .nav-item{ display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:8px; font-size:13.5px; color:var(--text-dim); cursor:pointer; }
  .nav-item.active{ background:var(--panel-2); color:var(--text); }
  .nav-item .dot{ width:6px;height:6px;border-radius:50%; background:var(--text-dim); }
  .nav-item.active .dot{ background:var(--amber); }

  .examples{ font-size:12px; color:var(--text-dim); display:flex; flex-direction:column; gap:6px; margin-top:auto; }
  .examples .ex{ background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; cursor:pointer; }
  .examples .ex:hover{ border-color:var(--amber); color:var(--text); }

  /* Main panel */
  #main{ display:flex; flex-direction:column; height:100vh; }
  #topbar{ padding:14px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
  #topbar .title{ font-weight:600; font-size:14.5px; }
  #topbar .subtitle{ font-size:12px; color:var(--text-dim); margin-top:2px;}
  .snapshot-chip{ font-size:11px; color:var(--text-dim); border:1px solid var(--line); padding:5px 10px; border-radius:20px; }

  #view-chat{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
  #messages{ flex:1; overflow-y:auto; padding:24px 22px; display:flex; flex-direction:column; gap:16px; }
  .msg{ max-width:78%; padding:12px 14px; border-radius:12px; font-size:14px; line-height:1.55; white-space:pre-wrap; }
  .msg.user{ align-self:flex-end; background:#2a3a52; border:1px solid #34486a; }
  .msg.assistant{ align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .msg.system-note{ align-self:center; color:var(--text-dim); font-size:12px; background:transparent; }

  .trust-wrap{ align-self:flex-start; max-width:78%; display:flex; flex-direction:column; gap:6px; }
  .trust-badge{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; width:fit-content; cursor:default; letter-spacing:.02em; }
  .trust-badge .pulse{ width:7px;height:7px;border-radius:50%; }
  .trust-badge.verified{ background:#12301f; color:var(--green); }
  .trust-badge.verified .pulse{ background:var(--green); box-shadow:0 0 0 0 rgba(79,191,133,.6); animation:pulse 2s infinite; }
  .trust-badge.needs_review{ background:#3a2a12; color:var(--amber); }
  .trust-badge.needs_review .pulse{ background:var(--amber); box-shadow:0 0 0 0 rgba(232,163,61,.6); animation:pulse 2s infinite; }
  .trust-badge.informational{ background:#1c2635; color:var(--text-dim); }
  .trust-badge.informational .pulse{ background:var(--text-dim); }
  .trust-badge.error{ background:#3a1b1b; color:var(--red); }
  .trust-badge.error .pulse{ background:var(--red); box-shadow:0 0 0 0 rgba(224,101,90,.6); animation:pulse 2s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(255,255,255,.35);} 70%{box-shadow:0 0 0 6px rgba(255,255,255,0);} 100%{box-shadow:0 0 0 0 rgba(255,255,255,0);} }
  .trust-reasons{ font-size:11.5px; color:var(--text-dim); line-height:1.5; padding-left:2px; }
  .trust-reasons div::before{ content:"— "; }

  .trace{ align-self:flex-start; display:flex; flex-wrap:wrap; gap:6px; max-width:78%; }
  .trace .chip{ font-size:11px; padding:4px 9px; border-radius:20px; background:var(--panel-2); border:1px solid var(--line); color:var(--blue); font-family:'IBM Plex Mono',monospace; cursor:pointer; }
  .trace .chip:hover{ border-color:var(--blue); }

  .action-card{ align-self:flex-start; max-width:78%; background:var(--amber-dim); border:1px solid var(--amber); border-radius:12px; padding:14px; font-size:13.5px; }
  .action-card .hdr{ display:flex; align-items:center; gap:8px; color:var(--amber); font-weight:600; margin-bottom:6px; font-size:12.5px; text-transform:uppercase; letter-spacing:.04em;}
  .action-card .summary{ color:var(--text); margin-bottom:12px; }
  .action-card .btns{ display:flex; gap:8px; }
  .action-card button{ padding:8px 14px; border-radius:7px; border:none; font-size:13px; font-weight:600; cursor:pointer; }
  .action-card .confirm{ background:var(--green); color:#08201a; }
  .action-card .cancel{ background:transparent; color:var(--text-dim); border:1px solid var(--line) !important; }
  .action-card.done{ opacity:.6; }

  #composer{ padding:16px 22px; border-top:1px solid var(--line); display:flex; gap:10px; }
  #composer input{ flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:12px 14px; border-radius:10px; font-size:14px; font-family:inherit; }
  #composer input:focus{ outline:none; border-color:var(--amber); }
  #composer button{ background:var(--amber); border:none; color:#1a1204; font-weight:700; padding:0 20px; border-radius:10px; cursor:pointer; font-size:14px; }
  #composer button:disabled{ opacity:.5; cursor:default; }

  .typing{ align-self:flex-start; color:var(--text-dim); font-size:13px; }

  /* Insights view */
  #view-insights{ flex:1; overflow-y:auto; padding:24px 22px; display:none; flex-direction:column; gap:18px; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
  .panel h3{ margin:0 0 12px 0; font-size:13.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); }
  .flag-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .flag-row:last-child{ border-bottom:none; }
  .badge{ font-size:11px; padding:3px 8px; border-radius:20px; font-weight:600; }
  .badge.breach{ background:#3a1b1b; color:var(--red); }
  .badge.ok{ background:#1b3a2a; color:var(--green); }
  .badge.cross{ background:var(--amber-dim); color:var(--amber); }
  .muted{ color:var(--text-dim); font-size:12px; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="brand">
      <div class="mark">PP</div>
      <div>
        <div class="name">ParcelPilot</div>
        <div class="tag">Support Console</div>
      </div>
    </div>

    <div class="field">
      <label>Signed in as</label>
      <div class="role-toggle">
        <button id="btn-customer" class="active" onclick="setRole('customer')">Customer</button>
        <button id="btn-staff" onclick="setRole('staff')">Staff</button>
      </div>
    </div>

    <div class="field" id="account-field">
      <label>Account</label>
      <select id="account-select"></select>
    </div>

    <div class="field" id="staff-field" style="display:none;">
      <label>Staff member</label>
      <input class="mono" id="staff-name" value="Priya Mehta" style="background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:9px 10px; border-radius:8px; font-size:13.5px;">
    </div>

    <div class="divider"></div>

    <div class="field">
      <label>View</label>
      <div class="nav-item active" id="nav-chat" onclick="setView('chat')"><span class="dot"></span> Chat</div>
      <div class="nav-item" id="nav-insights" onclick="setView('insights')" style="display:none;"><span class="dot"></span> Proactive insights</div>
    </div>

    <div class="divider"></div>
    <div class="context-card" id="context-card"></div>

    <div class="examples" id="examples"></div>
  </div>

  <div id="main">
    <div id="topbar">
      <div>
        <div class="title" id="view-title">Support chat</div>
        <div class="subtitle" id="view-subtitle">Ask about policies, orders, cancellations, or credits.</div>
      </div>
      <div class="snapshot-chip mono">snapshot: 2026-08-16 11:00 IST</div>
    </div>

    <div id="view-chat">
      <div id="messages"></div>
      <div id="composer">
        <input id="input" type="text" placeholder="Ask a question…" onkeydown="if(event.key==='Enter') send();">
        <button id="send-btn" onclick="send()">Send</button>
      </div>
    </div>

    <div id="view-insights"></div>
  </div>
</div>

<script>
const API = '';
let state = { role: 'customer', accountId: null, staffName: 'Priya Mehta', history: [] };

const CUSTOMER_EXAMPLES = [
  "Can I cancel ORD-1001 without a fee?",
  "A pickup is 3 hours late because of carrier fault. Do I get a credit?",
  "What's your P1 response time for my plan?",
  "Does bulk upload support 4,200 rows?"
];
const STAFF_EXAMPLES = [
  "Summarize open tickets for Northstar Logistics",
  "Is TKT-501 breaching SLA? Should we escalate?",
  "Calculate the service credit for ORD-2002",
  "Create a follow-up task for the bulk upload issue on LumenWorks"
];

async function loadAccounts(){
  const res = await fetch(`${API}/api/accounts`);
  const accounts = await res.json();
  const sel = document.getElementById('account-select');
  sel.innerHTML = accounts.map(a => `<option value="${a.account_id}">${a.account_name} (${a.plan})</option>`).join('');
  sel.onchange = () => { state.accountId = sel.value; updateContextCard(); };
  state.accountId = accounts[0].account_id;
  window._accounts = accounts;
  updateContextCard();
}

function setRole(role){
  state.role = role;
  document.getElementById('btn-customer').classList.toggle('active', role==='customer');
  document.getElementById('btn-staff').classList.toggle('active', role==='staff');
  document.getElementById('account-field').style.display = role==='customer' ? 'flex' : 'none';
  document.getElementById('staff-field').style.display = role==='staff' ? 'flex' : 'none';
  document.getElementById('nav-insights').style.display = role==='staff' ? 'flex' : 'none';
  if(role==='staff' && document.getElementById('view-insights').style.display==='flex'){} 
  renderExamples();
  updateContextCard();
  resetChat(`Switched to ${role} view.`);
}

function updateContextCard(){
  const card = document.getElementById('context-card');
  if(state.role === 'customer'){
    const acct = (window._accounts||[]).find(a=>a.account_id===state.accountId) || {};
    card.innerHTML = `<b>Role:</b> Customer<br><b>Account:</b> ${acct.account_name||''} (${state.accountId||''})<br><span class="muted">Data is scoped to this account only — enforced server-side.</span>`;
  } else {
    card.innerHTML = `<b>Role:</b> Staff<br><b>User:</b> ${state.staffName}<br><span class="muted">Full access across accounts for authorised operations use.</span>`;
  }
}

function renderExamples(){
  const list = state.role === 'customer' ? CUSTOMER_EXAMPLES : STAFF_EXAMPLES;
  document.getElementById('examples').innerHTML = list.map(q =>
    `<div class="ex" onclick="document.getElementById('input').value=${JSON.stringify(q)}; send();">${q}</div>`
  ).join('');
}

function setView(view){
  document.getElementById('nav-chat').classList.toggle('active', view==='chat');
  document.getElementById('nav-insights').classList.toggle('active', view==='insights');
  document.getElementById('view-chat').style.display = view==='chat' ? 'flex' : 'none';
  document.getElementById('view-insights').style.display = view==='insights' ? 'flex' : 'none';
  document.getElementById('view-title').textContent = view==='chat' ? 'Support chat' : 'Proactive issue detection';
  document.getElementById('view-subtitle').textContent = view==='chat'
    ? 'Ask about policies, orders, cancellations, or credits.'
    : 'Recurring, urgent, or unusual patterns surfaced automatically.';
  if(view==='insights') loadInsights();
}

async function loadInsights(){
  const box = document.getElementById('view-insights');
  box.innerHTML = '<div class="muted">Loading…</div>';
  const res = await fetch(`${API}/api/insights`);
  const data = await res.json();

  const sla = data.p1_candidates_and_sla.map(f => `
    <div class="flag-row">
      <div><b class="mono">${f.ticket_id}</b> — ${f.subject}<br><span class="muted">${f.account_name} · ${f.reason} · open ${f.minutes_open}m / target ${f.p1_target_minutes}m</span></div>
      <span class="badge ${f.sla_breached ? 'breach' : 'ok'}">${f.sla_breached ? 'SLA BREACHED' : 'within target'}</span>
    </div>`).join('') || '<div class="muted">None detected.</div>';

  const recurring = data.recurring_or_cross_customer_issues.map(c => `
    <div class="flag-row">
      <div><b>${c.cluster}</b><br><span class="muted">${c.ticket_count} tickets · ${c.distinct_accounts_affected} account(s) · ${c.tickets.map(t=>t.ticket_id).join(', ')}</span></div>
      ${c.cross_customer ? '<span class="badge cross">cross-customer</span>' : ''}
    </div>`).join('') || '<div class="muted">None detected.</div>';

  const orders = data.unresolved_carrier_fault_pickups.map(o => `
    <div class="flag-row">
      <div><b class="mono">${o.order_id}</b> — ${o.account_id}<br><span class="muted">${o.notes}</span></div>
      <span class="badge breach">carrier fault, unresolved</span>
    </div>`).join('') || '<div class="muted">None detected.</div>';

  box.innerHTML = `
    <div class="panel"><h3>P1 candidates &amp; SLA status</h3>${sla}</div>
    <div class="panel"><h3>Recurring / cross-customer product issues</h3>${recurring}</div>
    <div class="panel"><h3>Unresolved carrier-fault pickups</h3>${orders}</div>
  `;
}

function resetChat(note){
  state.history = [];
  document.getElementById('messages').innerHTML = note ? `<div class="msg system-note">${note}</div>` : '';
}

function addMsg(role, content){
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = content;
  document.getElementById('messages').appendChild(div);
  scrollDown();
  return div;
}

function addTrace(trace){
  if(!trace || !trace.length) return;
  const wrap = document.createElement('div');
  wrap.className = 'trace';
  trace.forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = `🔧 ${t.tool}`;
    chip.title = JSON.stringify(t.result, null, 2);
    chip.onclick = () => alert(JSON.stringify({args: t.args, result: t.result}, null, 2));
    wrap.appendChild(chip);
  });
  document.getElementById('messages').appendChild(wrap);
  scrollDown();
}

function addActionCard(actionResult){
  const card = document.createElement('div');
  card.className = 'action-card';
  card.innerHTML = `
    <div class="hdr">⚠ Confirmation needed — ${actionResult.action_id}</div>
    <div class="summary">${actionResult.summary}</div>
    <div class="btns">
      <button class="confirm">Confirm action</button>
      <button class="cancel" style="border:1px solid var(--line);">Not now</button>
    </div>`;
  const [confirmBtn, cancelBtn] = card.querySelectorAll('button');
  confirmBtn.onclick = async () => {
    const res = await fetch(`${API}/api/actions/${actionResult.action_id}/confirm`, {method:'POST'});
    const data = await res.json();
    card.classList.add('done');
    card.querySelector('.hdr').textContent = data.status === 'executed' ? '✅ Action executed' : '❌ Failed';
    card.querySelector('.btns').remove();
  };
  cancelBtn.onclick = () => {
    card.classList.add('done');
    card.querySelector('.hdr').textContent = '— Action left unconfirmed';
    card.querySelector('.btns').remove();
  };
  document.getElementById('messages').appendChild(card);
  scrollDown();
}

const TRUST_LABELS = {
  verified: 'Verified',
  needs_review: 'Needs review',
  informational: 'Informational',
  error: 'Error',
};

function addTrustBadge(trust){
  if(!trust) return;
  const wrap = document.createElement('div');
  wrap.className = 'trust-wrap';
  const level = trust.level || 'informational';
  wrap.innerHTML = `
    <div class="trust-badge ${level}"><span class="pulse"></span>${TRUST_LABELS[level] || level}</div>
    <div class="trust-reasons">${(trust.reasons||[]).map(r=>`<div>${r}</div>`).join('')}</div>
  `;
  document.getElementById('messages').appendChild(wrap);
  scrollDown();
}

function scrollDown(){
  const box = document.getElementById('messages');
  box.scrollTop = box.scrollHeight;
}

async function send(){
  const input = document.getElementById('input');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  document.getElementById('send-btn').disabled = true;

  addMsg('user', text);
  state.history.push({role:'user', content:text});

  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.textContent = 'thinking…';
  document.getElementById('messages').appendChild(typing);
  scrollDown();

  try{
    const res = await fetch(`${API}/api/chat`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        messages: state.history,
        role: state.role,
        account_id: state.role==='customer' ? state.accountId : null,
        staff_name: state.role==='staff' ? state.staffName : null,
      })
    });
    const data = await res.json();
    typing.remove();

    addTrace(data.trace);
    addMsg('assistant', data.reply || '(no reply)');
    addTrustBadge(data.trust);
    state.history.push({role:'assistant', content: data.reply || ''});

    (data.trace||[]).forEach(t => {
      if(t.tool === 'propose_action' && t.result && t.result.action_id){
        addActionCard(t.result);
      }
    });
  } catch(e){
    typing.remove();
    addMsg('assistant', 'Something went wrong reaching the server: ' + e.message);
  }
  document.getElementById('send-btn').disabled = false;
}

document.getElementById('staff-name').addEventListener('input', e => { state.staffName = e.target.value; updateContextCard(); });

loadAccounts();
renderExamples();
</script>
</body>
</html>
